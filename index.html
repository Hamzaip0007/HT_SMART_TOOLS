<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HT Smart Tools</title>
<meta name="description" content="Free online tools: merge PDF, compress PDF, compress images, QR code generator, word counter, calculators and developer tools. No sign-up, files stay in your browser.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: sticky header, hero with search, card grids, tool workbench panel. Blue/white, dark mode via tokens. */
:root{
  --bg:#f5f8ff;--surface:#ffffff;--surface2:#edf2ff;--ink:#0d1a3a;--muted:#55638a;
  --accent:#2155e6;--accent-ink:#ffffff;--soft:#e2eaff;--line:#d8e1f5;
  --ok:#0f7a58;--err:#c4321f;
  --c-pdf:#2155e6;--c-image:#0b7fc4;--c-text:#4453d4;--c-qr:#0e8a8e;--c-calc:#2a6bd8;--c-dev:#5a49d2;
  --shadow:0 1px 2px rgba(13,26,58,.06),0 10px 28px -14px rgba(33,85,230,.35);
  --display:'Sora','Inter',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1126;--surface:#121b36;--surface2:#18234a;--ink:#e8edfb;--muted:#9aa8cc;
  --accent:#6d99ff;--accent-ink:#071030;--soft:#1b2a5a;--line:#243258;
  --ok:#4fd1a1;--err:#ff8d7c;
  --c-pdf:#7aa2ff;--c-image:#53b6f0;--c-text:#8f9bff;--c-qr:#4fd0d4;--c-calc:#6fa0ff;--c-dev:#a393ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1126;--surface:#121b36;--surface2:#18234a;--ink:#e8edfb;--muted:#9aa8cc;
  --accent:#6d99ff;--accent-ink:#071030;--soft:#1b2a5a;--line:#243258;
  --ok:#4fd1a1;--err:#ff8d7c;
  --c-pdf:#7aa2ff;--c-image:#53b6f0;--c-text:#8f9bff;--c-qr:#4fd0d4;--c-calc:#6fa0ff;--c-dev:#a393ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[lang="ur"] body{font-family:'Noto Nastaliq Urdu','Inter',system-ui,sans-serif;line-height:2.05}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
html[lang="ur"] h1,html[lang="ur"] h2,html[lang="ur"] h3{font-family:'Noto Nastaliq Urdu',var(--display);line-height:1.8}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin-inline:auto}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap}
.logo b{color:var(--accent);font-weight:700}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em}
.nav{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
.nav a{padding:8px 11px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14px}
.nav a:hover,.nav a.on{background:var(--soft);color:var(--accent)}
.hdr-actions{display:flex;gap:6px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:grid;place-items:center;cursor:pointer;font-size:13px;font-weight:600}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib svg{width:18px;height:18px}
.menu-btn{display:none}
@media (max-width:980px){
  .menu-btn{display:grid}
  .nav{display:none;position:absolute;inset:62px 0 auto 0;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) 14px;flex-direction:column;margin:0}
  .nav.open{display:flex}
  .hdr-actions{margin-inline-start:auto}
}
main{padding-block:28px 56px;min-height:70vh}
.hero{padding:44px 0 30px;text-align:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--soft);color:var(--accent);font-weight:600;font-size:13px;padding:6px 12px;border-radius:99px}
.hero h1{font-size:clamp(30px,5.2vw,54px);margin:16px auto 12px;max-width:16ch}
html[lang="ur"] .hero h1{max-width:20ch}
.hero p{color:var(--muted);max-width:60ch;margin:0 auto 24px;font-size:16.5px}
.sbox{position:relative;max-width:620px;margin:0 auto}
.sbox input{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding-inline:50px 16px;font-size:16px;box-shadow:var(--shadow)}
.sbox input:focus{outline:none;border-color:var(--accent)}
.sbox>svg{position:absolute;inset-inline-start:17px;top:17px;width:22px;height:22px;color:var(--muted)}
.sr{position:absolute;inset-inline:0;top:62px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:20;text-align:start;overflow:hidden}
.sr a{display:flex;gap:12px;align-items:center;padding:10px 14px}
.sr a:hover,.sr a.hl{background:var(--soft)}
.sr small{color:var(--muted);display:block}
.sr .none{padding:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13.5px;color:var(--muted);cursor:pointer}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
section.blk{margin-top:44px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:clamp(21px,3vw,28px)}
.sh a{color:var(--accent);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;transition:transform .18s,box-shadow .18s,border-color .18s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card.soon{opacity:.6;pointer-events:none}
.ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.ct b{font-family:var(--display);font-weight:600;font-size:15px}
.ct span{color:var(--muted);font-size:13.5px;line-height:1.45}
.ic{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.ic svg{width:22px;height:22px}
.pdf{--c:var(--c-pdf)}.image{--c:var(--c-image)}.text{--c:var(--c-text)}.qr{--c:var(--c-qr)}.calc{--c:var(--c-calc)}.dev{--c:var(--c-dev)}
.badge{position:absolute;top:10px;inset-inline-end:10px;font-style:normal;font-size:11px;font-weight:600;background:var(--soft);color:var(--accent);padding:2px 8px;border-radius:99px}
.cat-card{align-items:center}
.cat-card .ct span{font-size:13px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.why div{background:var(--surface2);border-radius:16px;padding:20px}
.why h3{font-size:16px;margin-bottom:6px}
.why p{margin:0;color:var(--muted);font-size:14px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;font-family:var(--display);font-size:15px}
details p{color:var(--muted);margin:8px 0 0}
.crumb{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.crumb a:hover{color:var(--accent)}
.thead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.thead .ic{width:54px;height:54px}
.thead h1{font-size:clamp(24px,4vw,34px)}
.thead p{color:var(--muted);margin:4px 0 0;max-width:64ch}
.fav{margin-inline-start:auto}
.fav.on{color:#e6a100;border-color:#e6a100}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bench{display:flex;flex-direction:column;gap:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split>*{min-width:0}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13.5px;color:var(--muted);min-width:0}
.inp,.ta,select{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;width:100%;color:var(--ink);font-size:14.5px}
.inp:focus,.ta:focus,select:focus{outline:none;border-color:var(--accent)}
.ta{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.5}
input[type=color]{height:42px;padding:3px;width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:11px;font-weight:600;cursor:pointer;align-self:flex-start;font-size:14.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opts{flex-direction:row;flex-wrap:wrap;align-items:flex-end}
.opts .lbl{flex:1 1 170px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.chk input{accent-color:var(--accent);width:17px;height:17px}
.note{color:var(--muted);font-size:13px}
.err{color:var(--err);margin:0;font-weight:500}
.okk{color:var(--ok)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface);border-radius:18px;padding:34px 16px;cursor:pointer;text-align:center;transition:background .15s}
.drop:hover,.drop.over{background:var(--soft);border-color:var(--accent)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.drop span{color:var(--muted);font-size:13.5px}
.fileline{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;background:var(--surface2);padding:10px 14px;border-radius:11px}
.fileline span{color:var(--muted);font-size:13.5px}
.fileline b{overflow-wrap:anywhere}
.out{display:flex;flex-direction:column;gap:10px}
.result{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent);border-radius:12px;padding:12px 14px}
.result div{display:flex;flex-direction:column;min-width:0}
.result b{overflow-wrap:anywhere}
.result span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:11px;padding:8px 12px}
.li b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.li span{color:var(--muted);font-size:13px}
.preview{max-width:100%;border-radius:12px;border:1px solid var(--line);background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.center{align-items:center;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:13px;padding:12px 14px;border:1.5px solid transparent}
.stat.f{border-color:var(--accent);background:var(--soft)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.big{font-family:var(--display);font-size:clamp(26px,5vw,38px);font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys.sci{grid-template-columns:repeat(5,1fr)}
.key{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:50px;font-size:17px;font-weight:600;cursor:pointer}
.key:hover{border-color:var(--accent)}
.key.op{background:var(--soft);color:var(--accent)}
.key.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.disp{font-family:var(--display);font-size:26px;text-align:end;height:56px;direction:ltr}
.res{min-height:30px;text-align:end;color:var(--muted);font-size:20px;direction:ltr;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:end;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;transition:width .2s}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw i{height:44px;border-radius:9px;border:1px solid var(--line)}
.prose{max-width:760px}
.prose h2{margin:26px 0 8px;font-size:22px}
.prose p,.prose li{color:var(--muted)}
.foot{border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:32px max(16px,env(safe-area-inset-left,0px)) 28px;background:var(--surface)}
.foot-in{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
@media (max-width:760px){.foot-in{grid-template-columns:1fr}}
.foot h4{margin:0 0 8px;font-family:var(--display);font-size:14px}
.foot a{display:block;color:var(--muted);padding:3px 0;font-size:14px}
.foot a:hover{color:var(--accent)}
.foot a.logo{display:flex;color:var(--ink);padding:0}
.copy{margin-top:22px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.vc{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface2);font-size:13.5px;color:var(--muted)}
.vc[hidden]{display:none}
.vc i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.vc b{font-family:var(--display);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:1ch}
.vc.load b{display:inline-block;width:58px;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line) 25%,var(--surface) 50%,var(--line) 75%);background-size:200% 100%;animation:vcsh 1.2s linear infinite}
@keyframes vcsh{to{background-position:-200% 0}}
#toast{position:fixed;inset-inline:16px;bottom:max(18px,env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:440px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:90;font-size:14px;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:none}
canvas{max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;animation:none!important}}
</style>

<script>
"use strict";
/* ---------- public visitor counter (Supabase) ---------- */
// Paste your Supabase project values here (Project Settings > API).
// The anon / publishable key is meant to be public. NEVER paste a service_role or secret key here.
const SUPABASE_URL='https://nbpemgwyepisdeehmkjj.supabase.co';       // e.g. 'https://abcdefgh.supabase.co'
const SUPABASE_ANON_KEY='sb_publishable_vhFnUrOOkwh6f8HZ7AGFHA_SeYhp-1z';  // anon (eyJ...) or publishable (sb_publishable_...) key
let VIS={state:'off',count:null};
function isBot(){
  const ua=navigator.userAgent||'';
  return !!navigator.webdriver||/bot|crawl|spider|slurp|headless|lighthouse|pagespeed|preview|facebookexternalhit|pingdom|monitor|curl|wget|python|node-fetch/i.test(ua)||!/^https?:$/.test(location.protocol)||['localhost','127.0.0.1','[::1]'].includes(location.hostname);
}
function uuid4(){
  if(crypto.randomUUID)return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function visitorId(){
  try{let v=localStorage.getItem('ht-vid');if(!v||!/^[0-9a-f-]{36}$/i.test(v)){v=uuid4();localStorage.setItem('ht-vid',v)}return v}catch(e){return window.__htvid||(window.__htvid=uuid4())}
}
async function rpc(fn,body){
  const h={'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY};
  if(SUPABASE_ANON_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_ANON_KEY;
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);
  try{const r=await fetch(SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body||{}),signal:ac.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}
}
async function initVisits(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||window.__vcStarted)return;
  window.__vcStarted=true;VIS={state:'loading',count:null};showVisits();
  try{
    const today=new Date().toISOString().slice(0,10);let n;
    let last=null;try{last=localStorage.getItem('ht-last-count')}catch(e){}
    if(!isBot()&&last!==today){n=await rpc('track_visit',{p_visitor:visitorId()});try{localStorage.setItem('ht-last-count',today)}catch(e){}}
    else n=await rpc('get_visit_count');
    if(typeof n!=='number'||!isFinite(n))throw new Error('bad response');
    VIS={state:'ok',count:n};
  }catch(e){VIS={state:'err',count:null}}
  showVisits();
}
function showVisits(){
  const e=$('#vc');if(!e)return;
  if(VIS.state==='off'){e.hidden=true;return}
  e.hidden=false;e.className='vc'+(VIS.state==='loading'?' load':'');
  const label=LANG==='ur'?'کل وزیٹرز':'Total visitors';
  e.innerHTML=VIS.state==='err'?'<span>'+(LANG==='ur'?'وزیٹر کاؤنٹر ابھی دستیاب نہیں':'Visitor count is unavailable right now')+'</span>':'<i aria-hidden="true"></i><span>'+label+'</span><b>'+(VIS.state==='ok'?VIS.count.toLocaleString('en-US'):'&nbsp;')+'</b>';
  e.setAttribute('aria-live','polite');
}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fsize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';

function matches(file,accept){return accept.split(',').map(s=>s.trim()).some(a=>a.startsWith('.')?file.name.toLowerCase().endsWith(a):a.endsWith('/*')?file.type.startsWith(a.slice(0,-1)):file.type===a)}
function dropzone(host,{accept,multiple,label,onFiles}){
  host.innerHTML='<label class="drop" tabindex="0">'+ICON.up+'<b>'+esc(label||'Drop files here')+'</b><span>or click to browse · max '+MAXMB+' MB per file</span><input type="file" hidden '+(multiple?'multiple ':'')+'accept="'+esc(accept)+'"></label>';
  const d=$('.drop',host),inp=$('input',host);
  const take=fl=>{
    const ok=[];for(const f of fl){
      if(!matches(f,accept)){toast(f.name+' is not a supported file type.');continue}
      if(f.size>MAXMB*1048576){toast(f.name+' is larger than '+MAXMB+' MB.');continue}
      if(!f.size){toast(f.name+' is empty.');continue}
      ok.push(f)}
    if(ok.length)onFiles(multiple?ok:[ok[0]])};
  inp.onchange=()=>{take(inp.files);inp.value=''};
  d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}};
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',e=>take(e.dataTransfer.files));
}
function showResult(out,name,data,note){
  const blob=data instanceof Blob?data:new Blob([data]);
  const d=document.createElement('div');d.className='result';
  d.innerHTML='<div><b>'+esc(name)+'</b><span>'+fsize(blob.size)+(note?' · '+esc(note):'')+'</span></div><button class="btn">Download</button>';
  $('button',d).onclick=()=>saveFile(name,blob);out.appendChild(d);
}
const baseName=f=>f.name.replace(/\.[^.]+$/,'');

/* ---------- PDF tools ---------- */
const PL=()=>{if(!window.PDFLib)throw new Error('The PDF engine did not load. Check your connection and reload.');return window.PDFLib};
async function readPdf(file){return PL().PDFDocument.load(await file.arrayBuffer(),{ignoreEncryption:true})}
function parseRanges(str,n){
  const groups=[];
  for(const part of str.split(',').map(s=>s.trim()).filter(Boolean)){
    const m=part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw new Error('Not a valid range: "'+part+'". Use numbers like 1-3, 5.');
    let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];
    if(a<1||b>n)throw new Error('Page '+(a<1?a:b)+' is outside this PDF (1 to '+n+').');
    const g=[];for(let i=a;i<=b;i++)g.push(i-1);groups.push(g)}
  if(!groups.length)throw new Error('Enter the pages you want, for example 1-3, 5.');
  return groups;
}
function pdfSingle(el,{range,rangeLabel,placeholder,optional,extra,btn,run}){
  el.innerHTML='<div class="dz"></div><div class="panel" id="pp" hidden></div>';
  dropzone($('.dz',el),{accept:'.pdf,application/pdf',label:'Drop your PDF here',onFiles:async fs=>{
    const f=fs[0];let doc;
    try{doc=await readPdf(f)}catch(e){toast(e.message.includes('engine')?e.message:'This PDF could not be opened. It may be damaged or password protected.');return}
    const n=doc.getPageCount(),pp=$('#pp',el);pp.hidden=false;
    pp.innerHTML='<div class="fileline"><b>'+esc(f.name)+'</b><span>'+n+' pages · '+fsize(f.size)+'</span></div>'+
      (range?field('rg',rangeLabel,'placeholder="'+placeholder+'"'):'')+(extra||'')+'<button class="btn" id="go">'+btn+'</button><div class="out" id="out"></div>';
    $('#go',pp).onclick=async()=>{
      const out=$('#out',pp);out.innerHTML='';
      try{const v=range?$('#rg',pp).value.trim():'';await run({doc,file:f,n,pp,out,groups:range&&(v||!optional)?parseRanges(v,n):null})}
      catch(e){out.innerHTML='<p class="err">'+esc(e.message)+'</p>'}};
  }});
}
function multiList(el,{accept,label,btn,minItems,extra,run}){
  let items=[];
  el.innerHTML='<div class="dz"></div><div class="panel" id="pp" hidden><div class="list" id="lst"></div>'+(extra||'')+'<button class="btn" id="go">'+btn+'</button><div class="out" id="out"></div></div>';
  const lst=$('#lst',el),pp=$('#pp',el);
  const draw=()=>{
    pp.hidden=!items.length;
    lst.innerHTML=items.map((f,i)=>'<div class="li"><span>'+(i+1)+'</span><b>'+esc(f.name)+'</b><span>'+fsize(f.size)+'</span><button class="btn ghost sm" data-a="u" data-i="'+i+'" aria-label="Move up">↑</button><button class="btn ghost sm" data-a="d" data-i="'+i+'" aria-label="Move down">↓</button><button class="btn ghost sm" data-a="x" data-i="'+i+'" aria-label="Remove">✕</button></div>').join('')};
  lst.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;
    if(a==='x')items.splice(i,1);
    if(a==='u'&&i>0)[items[i-1],items[i]]=[items[i],items[i-1]];
    if(a==='d'&&i<items.length-1)[items[i+1],items[i]]=[items[i],items[i+1]];draw()};
  dropzone($('.dz',el),{accept,multiple:true,label,onFiles:fs=>{items=items.concat(fs);draw()}});
  $('#go',el).onclick=async()=>{const out=$('#out',el);out.innerHTML='';
    if(items.length<minItems){out.innerHTML='<p class="err">Add at least '+minItems+' file'+(minItems>1?'s':'')+'.</p>';return}
    try{await run(items,out,pp)}catch(e){out.innerHTML='<p class="err">'+esc(e.message)+'</p>'}};
}
const pdfBytes=async d=>new Blob([await d.save()],{type:'application/pdf'});
function toolMerge(el){multiList(el,{accept:'.pdf,application/pdf',label:'Drop PDF files here',btn:'Merge PDFs',minItems:2,run:async(items,out)=>{
  const out_=await PL().PDFDocument.create();
  for(const f of items){const d=await readPdf(f);(await out_.copyPages(d,d.getPageIndices())).forEach(p=>out_.addPage(p))}
  showResult(out,'merged.pdf',await pdfBytes(out_),out_.getPageCount()+' pages')}})}
function toolSplit(el){pdfSingle(el,{range:true,rangeLabel:'Split into these parts (each comma-separated part becomes its own PDF)',placeholder:'1-3, 4-6, 7',btn:'Split PDF',run:async({doc,file,groups,out})=>{
  let i=0;for(const g of groups){const nd=await PL().PDFDocument.create();(await nd.copyPages(doc,g)).forEach(p=>nd.addPage(p));i++;
    showResult(out,baseName(file)+'-part'+i+'.pdf',await pdfBytes(nd),g.length+' page'+(g.length>1?'s':''))}}})}
function toolExtract(el){pdfSingle(el,{range:true,rangeLabel:'Pages to keep',placeholder:'1-3, 5',btn:'Extract pages',run:async({doc,file,groups,out})=>{
  const nd=await PL().PDFDocument.create();const idx=[...new Set(groups.flat())];(await nd.copyPages(doc,idx)).forEach(p=>nd.addPage(p));
  showResult(out,baseName(file)+'-extracted.pdf',await pdfBytes(nd),idx.length+' pages')}})}
function toolDelete(el){pdfSingle(el,{range:true,rangeLabel:'Pages to delete',placeholder:'2, 4-5',btn:'Delete pages',run:async({doc,file,groups,n,out})=>{
  const del=new Set(groups.flat());if(del.size>=n)throw new Error('That would remove every page. Keep at least one.');
  const keep=doc.getPageIndices().filter(i=>!del.has(i));const nd=await PL().PDFDocument.create();(await nd.copyPages(doc,keep)).forEach(p=>nd.addPage(p));
  showResult(out,baseName(file)+'-edited.pdf',await pdfBytes(nd),keep.length+' pages left')}})}
function toolRotatePdf(el){pdfSingle(el,{range:true,optional:true,rangeLabel:'Pages to rotate (leave empty for all pages)',placeholder:'all pages',
  extra:'<label class="lbl">Rotation<select id="ang"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">90° counter-clockwise</option></select></label>',btn:'Rotate PDF',
  run:async({doc,file,groups,pp,out})=>{const a=+$('#ang',pp).value;const set=groups?new Set(groups.flat()):null;
    doc.getPages().forEach((p,i)=>{if(!set||set.has(i))p.setRotation(PL().degrees((p.getRotation().angle+a)%360))});
    showResult(out,baseName(file)+'-rotated.pdf',await pdfBytes(doc))}})}
function canvasBlob(c,type,q){return new Promise(r=>c.toBlob(r,type,q))}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res({img:i,url:u});i.onerror=()=>rej(new Error('This image could not be read.'));i.src=u})}
function toolJpgPdf(el){multiList(el,{accept:'image/*',label:'Drop images here',btn:'Create PDF',minItems:1,
  extra:'<label class="lbl">Page size<select id="ps"><option value="a4">A4, image fitted with margin</option><option value="orig">Same size as each image</option></select></label>',
  run:async(items,out,pp)=>{const pdf=await PL().PDFDocument.create();const mode=$('#ps',pp).value;
    for(const f of items){let bytes,emb;const buf=new Uint8Array(await f.arrayBuffer());
      if(f.type==='image/jpeg')emb=await pdf.embedJpg(buf);
      else if(f.type==='image/png')emb=await pdf.embedPng(buf);
      else{const {img}=await loadImg(f);const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);
        emb=await pdf.embedPng(new Uint8Array(await (await canvasBlob(c,'image/png')).arrayBuffer()))}
      if(mode==='orig'){const pg=pdf.addPage([emb.width,emb.height]);pg.drawImage(emb,{x:0,y:0,width:emb.width,height:emb.height})}
      else{const W=595.28,H=841.89,m=28,s=Math.min((W-2*m)/emb.width,(H-2*m)/emb.height,1.5);const w=emb.width*s,h=emb.height*s;
        const pg=pdf.addPage([W,H]);pg.drawImage(emb,{x:(W-w)/2,y:(H-h)/2,width:w,height:h})}}
    showResult(out,'images.pdf',await pdfBytes(pdf),pdf.getPageCount()+' pages')}})}

/* ---------- PDF renderer tools (pdf.js) ---------- */
function pdfjs(){if(!window.pdfjsLib)throw new Error('The PDF renderer did not load. Check your connection and reload.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfjsLib}
async function openPdfJs(file){try{return await pdfjs().getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}catch(e){if(e&&e.message&&e.message.includes('renderer'))throw e;throw new Error('This PDF could not be rendered. It may be damaged or password protected.')}}
async function renderPage(pdf,num,scale){
  const pg=await pdf.getPage(num);let vp=pg.getViewport({scale});
  if(vp.width*vp.height>1.6e7){vp=pg.getViewport({scale:scale*Math.sqrt(1.6e7/(vp.width*vp.height))})}
  const [c,x]=mkCanvas(vp.width,vp.height,'#fff');await pg.render({canvasContext:x,viewport:vp}).promise;return c}
function toolPdfToJpg(el){pdfSingle(el,{range:true,optional:true,rangeLabel:'Pages to convert (leave empty for all pages, max 60 at a time)',placeholder:'all pages',
  extra:'<div class="grid2"><label class="lbl">Format<select id="fm"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label><label class="lbl">Quality<select id="sc"><option value="1">Small (72 dpi)</option><option value="1.5">Standard (108 dpi)</option><option value="2" selected>High (144 dpi)</option><option value="3">Very high (216 dpi)</option></select></label></div>',
  btn:'Convert to images',
  run:async({file,n,groups,pp,out})=>{const type=$('#fm',pp).value,sc=+$('#sc',pp).value;
    const pages=groups?[...new Set(groups.flat())].sort((a,b)=>a-b):[...Array(n).keys()];
    if(pages.length>60)throw new Error('Please choose 60 pages or fewer at a time.');
    const pdf=await openPdfJs(file),prog=document.createElement('p');prog.className='note';out.appendChild(prog);
    for(let k=0;k<pages.length;k++){prog.textContent='Converting page '+(pages[k]+1)+' ('+(k+1)+' of '+pages.length+')…';
      const c=await renderPage(pdf,pages[k]+1,sc),b=await encode(c,type,.9);
      showResult(out,baseName(file)+'-page'+(pages[k]+1)+'.'+EXT[type],b,c.width+' × '+c.height+' px');await new Promise(r=>setTimeout(r))}
    prog.remove()}})}
function toolCompressPdf(el){pdfSingle(el,{
  extra:'<label class="lbl">Compression level<select id="lv"><option value="light">Light: best quality</option><option value="medium" selected>Balanced</option><option value="strong">Strong: smallest file</option></select></label><p class="note">Each page is turned into a compressed image. This can shrink scanned or image-heavy PDFs a lot, but text in the result cannot be selected or searched. Text-only PDFs may not get smaller.</p>',
  btn:'Compress PDF',
  run:async({file,n,pp,out})=>{const P={light:[2,.8],medium:[1.4,.65],strong:[1,.5]}[$('#lv',pp).value];
    if(n>80)throw new Error('Please use a PDF with 80 pages or fewer.');
    const src=await openPdfJs(file),nd=await PL().PDFDocument.create(),prog=document.createElement('p');prog.className='note';out.appendChild(prog);
    for(let i=1;i<=src.numPages;i++){prog.textContent='Compressing page '+i+' of '+src.numPages+'…';
      const pg=await src.getPage(i),base=pg.getViewport({scale:1}),c=await renderPage(src,i,P[0]),b=await encode(c,'image/jpeg',P[1]);
      const img=await nd.embedJpg(new Uint8Array(await b.arrayBuffer())),page=nd.addPage([base.width,base.height]);page.drawImage(img,{x:0,y:0,width:base.width,height:base.height});c.width=c.height=0;await new Promise(r=>setTimeout(r))}
    prog.remove();const blob=await pdfBytes(nd),saved=Math.round((1-blob.size/file.size)*100);
    showResult(out,baseName(file)+'-compressed.pdf',blob,fsize(file.size)+' to '+fsize(blob.size)+(saved>0?' ('+saved+'% smaller)':''));

/* ---------- Calculators ---------- */
function calcEval(str,deg){
  const s=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/−/g,'-').replace(/\s+/g,'');
  let i=0;const rad=x=>deg?x*Math.PI/180:x,back=x=>deg?x*180/Math.PI:x;
  const F={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),asin:x=>back(Math.asin(x)),acos:x=>back(Math.acos(x)),atan:x=>back(Math.atan(x)),sqrt:Math.sqrt,ln:Math.log,log:Math.log10,abs:Math.abs,exp:Math.exp};
  const C={pi:Math.PI,e:Math.E};
  function expr(){let v=term();for(;;){if(s[i]==='+'){i++;v+=term()}else if(s[i]==='-'){i++;v-=term()}else return v}}
  function term(){let v=pow();for(;;){if(s[i]==='*'){i++;v*=pow()}else if(s[i]==='/'){i++;v/=pow()}else return v}}
  function pow(){const b=unary();if(s[i]==='^'){i++;return Math.pow(b,pow())}return b}
  function unary(){if(s[i]==='-'){i++;return -unary()}if(s[i]==='+'){i++;return unary()}return post()}
  function post(){let v=atom();while(s[i]==='%'){i++;v/=100}return v}
  function atom(){

    if(/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer|asdf)/i.test(p)){bits*=.75;tips.push('Avoid keyboard or number sequences.')}
    if(p.length<12)tips.push('Use at least 12 characters.');if(!/[A-Z]/.test(p)||!/[a-z]/.test(p))tips.push('Mix upper and lower case letters.');if(!/\d/.test(p))tips.push('Add numbers.');if(!/[^a-zA-Z0-9]/.test(p))tips.push('Add a symbol.');
    const lv=bits<28?0:bits<40?1:bits<60?2:bits<80?3:4,L=['Very weak','Weak','Fair','Strong','Very strong'][lv],col=['var(--err)','var(--err)','#d08a00','var(--ok)','var(--ok)'][lv];
    const sec=Math.pow(2,bits)/2/1e10,H=s=>s<1?'instantly':s<60?Math.round(s)+' seconds':s<3600?Math.round(s/60)+' minutes':s<86400?Math.round(s/3600)+' hours':s<3.15e7?Math.round(s/86400)+' days':s<3.15e9?Math.round(s/3.15e7)+' years':'centuries or more';
    mt.style.width=(lv+1)*20+'%';mt.style.background=col;
    $('#o',el).innerHTML='<div class="stat f"><b style="color:'+col+';font-size:22px">'+L+'</b><span>Strength</span></div><div class="stat"><b style="font-size:22px">'+Math.round(bits)+' bits</b><span>Estimated entropy</span></div><div class="stat"><b style="font-size:18px">'+H(sec)+'</b><span>Offline guessing at 10 billion/s</span></div>';
    $('#tips',el).innerHTML=tips.map(t=>'<li>'+t+'</li>').join('')};
  $('#pw',el).oninput=run;$('#sh',el).onchange=e=>$('#pw',el).type=e.target.checked?'text':'password';
}

function score(t,q){const n=t.name.toLowerCase(),h=(t.desc+' '+(t.kw||'')+' '+CATSHORT[t.cat]).toLowerCase();let s=0;for(const w of q.toLowerCase().split(/\s+/).filter(Boolean)){if(n.startsWith(w))s+=5;else if(n.includes(w))s+=3;else if(h.includes(w))s+=1;else return 0}return s}

function bindSearch(id,onEnter){
  const inp=$('#'+id),box=$('#'+id+'-r');if(!inp)return;let hl=-1;
  const show=()=>{const r=find(inp.value).slice(0,6);hl=-1;if(!inp.value.trim()){box.hidden=true;return}
    box.hidden=false;box.innerHTML=r.length?r.map(t=>'<a href="#tool-'+t.id+'"><span class="ic '+t.cat+'" style="width:34px;height:34px;border-radius:10px">'+ICON[t.cat]+'</span><span><b>'+esc(t.name)+'</b><small>'+esc(catN(t.cat))+'</small></span></a>').join(''):'<div class="none">'+esc(tr('none'))+'</div>'};
  inp.addEventListener('input',show);
  inp.addEventListener('keydown',e=>{const items=$$('a',box);
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();hl=(hl+1)%items.length}else if(e.key==='ArrowUp'&&items.length){e.preventDefault();hl=(hl-1+items.length)%items.length}
    else if(e.key==='Enter'){const t=items[hl]||items[0];if(t)location.hash=t.getAttribute('href').slice(1);return}else if(e.key==='Escape'){box.hidden=true;return}else return;
    items.forEach((a,i)=>a.classList.toggle('hl',i===hl))});
  document.addEventListener('click',e=>{if(!e.target.closest('.sbox'))box.hidden=true});
}
